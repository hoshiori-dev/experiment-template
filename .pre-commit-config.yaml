# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^LICENSE$
      - id: end-of-file-fixer
        exclude: ^LICENSE$
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^LICENSE$
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.9
    hooks:
      - id: ruff
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.10.9
    hooks:
      - id: uv-lock
        name: update uv.lock file
      - id: uv-export
        name: export dependencies to requirements.txt

  - repo: local
    hooks:
      - id: deno-fmt
        name: deno fmt
        entry: deno fmt
        language: system
        files: \.(?:[cm]?[jt]sx?|jsonc?|ya?ml|md|markdown)$
        exclude: ^LICENSE$

      - id: deno-lint
        name: deno lint
        entry: deno lint
        language: system
        files: \.(?:[cm]?[jt]sx?)$

      - id: just-fmt
        name: justfile formatting
        entry: just --fmt --check
        language: system
        pass_filenames: false
        files: ^(?:justfile|Justfile|\.justfile)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        name: secret scanning with gitleaks

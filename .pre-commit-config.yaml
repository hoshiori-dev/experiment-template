# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Hook types: pre-commit (content checks), commit-msg (message rules), pre-push (outbound
# check of the outgoing commits). `pre-commit install` installs all three.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^LICENSE$
      - id: end-of-file-fixer
        exclude: ^LICENSE$
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^LICENSE$
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.9
    hooks:
      - id: ruff
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: uv-lock
        name: update uv.lock file

  - repo: local
    hooks:
      - id: deno-fmt
        name: deno fmt
        entry: deno fmt
        language: system
        files: \.(?:[cm]?[jt]sx?|jsonc?|ya?ml|md|markdown)$
        # Same exclusions as deno.json; deno fmt errors when every file it is given is excluded.
        exclude: ^(?:LICENSE|\.specify/|\.claude/skills/|\.agents/skills/)

      - id: deno-lint
        name: deno lint
        entry: deno lint
        language: system
        files: \.(?:[cm]?[jt]sx?)$

      - id: just-fmt
        name: justfile formatting
        entry: just --fmt --check --unstable
        language: system
        pass_filenames: false
        files: ^(?:justfile|Justfile|\.justfile)$

      - id: check-commit-message
        name: commit message rules
        entry: uv run python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]

      - id: validate-run-records
        name: validate run records
        entry: uv run python scripts/run_record.py validate
        language: system
        files: ^experiments/.*/runs/R[0-9]{3}\.yaml$

      - id: check-branch-scope
        name: staged paths match the branch scope
        entry: uv run python scripts/check_branch_scope.py
        language: system
        pass_filenames: false
        always_run: true

      - id: outbound-history
        name: outbound check of outgoing commits
        entry: uv run python scripts/outbound_check.py --git-range
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: secret scanning with gitleaks

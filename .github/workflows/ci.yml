# Backstop: reruns the local checks on the platform. The local hooks are the gate; by the
# time this runs the content is already public.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: extractions/setup-just@v3

      - name: Install the root environment
        run: uv sync

      - name: Format check, lint, tests and record validation
        run: just check

      # commit-msg and pre-push hooks are skipped here: `pre-commit run` only runs the
      # pre-commit stage.
      - name: Pre-commit hooks on all files
        run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure
